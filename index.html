<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#073c34" />
    <meta name="application-name" content="แสดงตัวอย่าง" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="แสดงตัวอย่าง" />
    <title>แสดงตัวอย่าง</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <style>
      * { box-sizing: border-box; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; background: #f4f8f6; color: #073c34; }
      body { display: grid; place-items: center; padding: 28px; font-family: system-ui, -apple-system, sans-serif; }
      main { width: min(100%, 420px); text-align: center; }
      img { width: 144px; height: 144px; border-radius: 30px; box-shadow: 0 14px 34px rgba(7, 60, 52, .18); }
      h1 { margin: 22px 0 8px; font-size: 30px; }
      p { margin: 0 0 24px; color: #527069; line-height: 1.55; }
      a { display: block; padding: 15px 20px; border-radius: 16px; background: #126f5d; color: white; font-size: 18px; font-weight: 750; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="./icon-192.png" alt="" />
      <h1>แสดงตัวอย่าง</h1>
      <p>เพิ่มหน้านี้ไปยังหน้าจอโฮม แล้วเปิดจากไอคอนเพื่อใช้งานโปรแกรม</p>
      <a id="launch" href="https://script.google.com/macros/s/AKfycbxsovauuV2eZfHe_Yr_CKaQtHLqAjW_hmBX2ojI7mISm7b333pL3ZxW_RS1QuL3I9Yecw/exec?v=88">เปิดโปรแกรม</a>
    </main>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      }
      var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      if (standalone || new URLSearchParams(location.search).has("launch")) {
        location.replace(document.getElementById("launch").href);
      }
    </script>
  </body>
</html>
